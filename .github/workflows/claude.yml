# Copy to .github/workflows/claude.yml in a MalTarDesigns repo.
# Needs the CLAUDE_CODE_OAUTH_TOKEN repo secret and the Claude GitHub App.
# Source: https://github.com/MalTarDesigns/shared-workflows
name: Claude

on:
  pull_request:
    types: [opened, ready_for_review, reopened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  review:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    uses: MalTarDesigns/shared-workflows/.github/workflows/claude-review.yml@main
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  mention:
    if: github.event_name != 'pull_request' && contains(github.event.comment.body, '@claude')
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    uses: MalTarDesigns/shared-workflows/.github/workflows/claude-mention.yml@main
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
